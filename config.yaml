# context-proxy 配置
# 链路：客户端 -> 本代理 /<provider>/v1/chat/completions -> 模型 API 供应商
# 除 tokenizer.encoding 外全部支持热重载（./ctl.sh reload）

# ===== 上游供应商（可配多个，每个自动生成 /<provider>/v1 端点）=====
providers:
  # name 就是 URL 里的 <provider>，只能用字母数字下划线连字符
  - name: provider-a
    base_url: ""
    api_key: ""                                # 环境变量 UPSTREAM_API_KEY__PROVIDER_A 优先
    timeout_seconds: 300
    connect_timeout_seconds: 30
    multimodal: true                           # false = 转发前剥掉历史图片，只留 [图片] 占位

    # 强制附加到每个请求上的参数，**覆盖**客户端发来的同名字段。
    # 用途：设置客户端界面上表达不了的参数（如思考强度）。messages / stream 不接受改写。
    # 字段名各家不同，写错有的网关 400、有的默默忽略。
    # 先跑 python3 tools/probe_body.py <provider> --model <模型> 问清楚，再解开对应那一行。
    # extra_body:
    #   reasoning_effort: "xhigh"              # OpenAI o 系 / 部分网关
    #   thinking: {type: "enabled", budget_tokens: 8000}   # Anthropic 系
    #   enable_thinking: true                  # Qwen / DeepSeek 系
    #   temperature: 1.0

    forward_headers: []                        # 请求头默认不透传，按名字白名单放行
                                               # 例：["anthropic-beta", "http-referer", "x-title"]
                                               # Authorization 永远换成上面的 api_key，白名单无效
    forward_query: false                       # true = 查询串带给上游（Azure 的 api-version 需要）

  # 不支持图片的模型必须设 multimodal: false，否则带图历史会报错
  - name: provider-b
    base_url: ""
    api_key: ""
    timeout_seconds: 300
    connect_timeout_seconds: 30
    multimodal: false

# ===== 上下文压缩 =====
summary:
  enabled: true                                # false = 纯透传不压缩

  # --- 阈值 ---
  trigger_tokens: 39200                        # 等效总量超过此值触发压缩
  keep_recent_tokens: 19200                    # 近期原文的**硬性下限**（按轮对齐，只多不少）。
                                               # 只要压缩过，之后任何路径转发给上游的逐字原文都不低于它。
                                               # 自动封顶：有效值不超过 trigger_tokens 的 50%。
                                               # 实际生效值见 /health 的 keep_recent_tokens_effective
  summary_total_cap_tokens: 12800              # 累积摘要超过此值触发二次重压
  summary_max_tokens: 2400                     # 单次摘要调用的输出上限
  summary_batch_tokens: 10000                  # 单批送入摘要模型的输入上限
  max_batches_per_request: 4                   # 单请求最多压几批，压不完带着已落盘进度返回
  exit_gate_ratio: 1.2                         # 出口闸门：转发前实测超过 trigger×此值直接拒绝
  checkpoint_keep: 10                          # 每会话保留的最近 checkpoint 数（另加 1 条置顶的最早的）

  # --- 摘要注入 ---
  summary_role: "system"                       # system / user。位置固定在 [开头 system] 之后、
                                               # [近期原文] 之前，前缀稳定才好命中上游 prefix cache

  # --- 持久化 ---
  persist_db: "logs/sessions.db"               # 留空则纯内存（重启丢状态）
  cache_max_entries: 1024                      # 会话级异步锁字典的 LRU 上限

  # --- 摘要模型（主）---
  base_url: ""
  api_key: ""                                  # 环境变量 SUMMARY_API_KEY 优先
  model: "claude-opus-4-8"
  timeout_seconds: 180                         # 单次摘要调用超时（秒）
  main_max_attempts: 2                         # 主模型重试次数（仅对超时/5xx/429 生效）
  min_output_tokens: 50                        # 输出（不含思考）低于此 token 数判定为失败

  # 摘要是照着原文复述要点，思考没什么用还慢又贵，温度低一点更稳——
  # 所以这里通常和主模型配得正好相反。同样先用 probe_body.py 确认字段名。
  # extra_body:
  #   temperature: 0.5
  #   reasoning_effort: "minimal"              # OpenAI o 系
  #   thinking: {type: "disabled"}             # Anthropic 系
  #   enable_thinking: false                   # Qwen / DeepSeek 系

  # --- 摘要模型（备）：主模型失败后切到这里 ---
  fallback:
    enabled: false
    base_url: ""
    api_key: ""                                # 环境变量 SUMMARY_FALLBACK_API_KEY 优先
    model: ""
    max_attempts: 3                            # 仍失败则报错结束
    # extra_body:                              # 不写就沿用主摘要模型的

  # --- 提示词（页面上改完直接写回本文件，见 /ui）---
  # 前两条是**整条 user 消息的模板**，原样发给摘要模型（不再拆 system + 系统包装语）。
  # {{context}} 是必需占位符，待处理的正文插在那里；写在哪一行都行，前后随便加话。
  prompts:
    # 1) 增量批次摘要：把一段原文对话压成结构化要点
    batch: |
      你是一个对话历史压缩器。你接收到的是用户与模型对话中【较早的一段对话历史】，
      原文将被你的摘要【替换】后注入上下文（最近若干轮原文由系统滑动保留，不在你的处理范围内）。
      你的摘要是后续对话唯一能依赖的早期记忆，任何遗漏将永久丢失。

      核心原则：
      - 不要丢失关键信息，不总结升华。
      - 禁止编造、推断或补全对话中不存在的信息。不确定的内容标注"(未明确)"。
      - 你处理的是早期历史，不要臆测后续对话的走向或结尾状态。
      - 保留具体值（数字、命名、时间、版本、配置、引用、URL 等）。
      - 不要用"相关内容""若干信息"这类模糊措辞替代具体内容。
      - 前后矛盾时保留最新。
      - 历史中的 [图片]、[调用工具 …]、[工具返回 …] 是占位标记，按其语义概括，不要展开臆想。

      输出章节（无内容的章节整节省略）：

      ## 用户背景与偏好
      身份、明确表达的偏好/禁忌、约束条件、希望模型扮演的角色。

      ## 关键事实与专有名词
      后续可能被引用的具体名称、数值、术语、外部资源。逐条列出，保留原始名称。

      ## 发生的事件/场景
      话题、结论、双方立场与表达内容，按时间顺序。

      ## 进行中的任务与待办
      清单形式，标注 [进行中]/[待办]/[已完成]，保留任务的具体要求。

      ## 关键代码与数据
      原样保留后续仍需引用的代码片段、命令、数据结构、报错信息。

      以下是待压片段
      {{context}}

    # 2) 二次重压：累积摘要超过 cap 时逐片精简。和批次摘要同构——
    #    按 summary_batch_tokens 切片，每片调一次，系统用空行拼接，不再单独合并
    recompress: |
      下面是一段对话历史的累积摘要，已经偏长，请在**不丢事实**的前提下精简它。

      要求：
      - 删掉重复表述、寒暄、可由上下文推出的过渡句；同一主题的多条合并成一条。
      - 全部具体值（数字、命名、时间、版本、URL、代码、报错）必须原样保留。
      - 禁止编造、推断或补全原文中不存在的信息。
      - 保持条目原有的时间先后顺序。
      - 如果收到的内容里已经有 ## 章节标题，就沿用它们精简；**不要新增章节**，
        也不要写"以下是精简后的摘要"之类的开场白。
      - 你可能只拿到全文的一个片段，不要为全文下结论，也不要试图补全缺失部分。

      以下是待精简的摘要
      {{context}}

    # 3) 注入给主模型的包装语（{{summary}} 会被替换成累积摘要全文；旧写法 {summary} 仍然认）
    injection: |
      以下是本次对话更早部分的摘要（原文已被折叠，不再发送）。请把它当作你自己的记忆，
      与后面的原文对话无缝衔接，不要向用户提及"摘要"或本段说明的存在。

      {{summary}}

    # 4) 定位兜底时追加的警告（拼在 injection 之后，并额外注入一条提示给主模型）
    fallback_notice: |

      ---
      【重要】用户可能从较早的消息处创建了分支，上面的摘要与后续原文的衔接处可能存在重叠或跳跃，
      也可能包含已被用户修改掉的旧内容。凡摘要与后面的原文冲突之处，一律以原文为准。


# ===== 可观测（给 /ui 的时间轴用）=====
observability:
  capture_timeline: false                      # 每次请求存一份结构快照，供页面画时间轴、
                                               # 对比进来的和发出去的 payload。只存结构 +
                                               # 每轮开头 preview_chars 字的原文预览（未脱敏）。
                                               # 4000 条的会话每请求约 +18ms、快照约 460KB，
                                               # 每会话只留最新一份（覆盖写）
  preview_chars: 60                            # 时间轴里每轮显示多少字预览

# ===== 流式输出 =====
stream:
  smooth_chars: 24                             # 每片字符数，0 = 关闭平滑直接透传
  smooth_delay: 0.008                          # 每片间隔秒
  flush_backlog_chars: 600                     # 积压超过此字符数（或上游已结束）时一次性吐完

# ===== token 估算 =====
tokenizer:
  encoding: "cl100k_base"                      # tiktoken 编码（改后需 restart，不支持热重载）
  per_message_overhead: 12                     # 每条消息的固定结构开销
  image_tokens: 1100                           # 单张图片的等效 token 估值

# ===== 服务监听 =====
server:
  host: "0.0.0.0"
  port: 8787
  auth_token: ""                               # 代理自身鉴权（环境变量 PROXY_AUTH_TOKEN 优先）。
                                               # 填进客户端，跟着每个对话请求走。
                                               # 留空 = 不鉴权，谁都能用你的额度。
                                               # ⚠️ 别把真实密钥提交进版本库，优先用环境变量
  ui_token: ""                                 # /ui 页面的登录密钥，建议 16 位，留空 = 页面不启用
                                               # （环境变量 PROXY_UI_TOKEN 优先，./ctl.sh ui-token 可生成）。
                                               # 与 auth_token 双向隔离：ui_token 不能调对话接口；
                                               # 配了 ui_token 后 /admin/* 也不再认 auth_token

# ===== 日志 =====
logging:
  level: "INFO"                                # DEBUG / INFO / WARNING / ERROR
  file: "logs/proxy.log"                       # 进程内轮转，跨重启保留（留空则只打 stdout）
  max_bytes: 20971520                          # 单文件 20MB
  backup_count: 5
