# ============================================================
# context-proxy 配置
# 链路：AI Chat 客户端 -> 本代理 /<provider>/v1/chat/completions -> 模型 API 供应商
# 除 tokenizer.encoding 外，本文件所有字段都支持热重载（./ctl.sh reload）
# ============================================================

# ===== 上游模型供应商（可配多个，每个自动生成 /<provider>/v1 端点）=====
# name 就是 URL 里的 <provider>，自己起，只能用字母数字下划线连字符。
# api_key 优先读环境变量 UPSTREAM_API_KEY__<NAME大写>（name 中的 - 换成 _）
providers:
  # 多模态供应商示例：把 name 换成你自己的标识
  - name: provider-a
    base_url: ""
    api_key: ""
    timeout_seconds: 300
    connect_timeout_seconds: 30
    multimodal: true                           # false = 转发前剥掉历史里的图片，只留 [图片] 占位

  # 纯文本供应商示例：不支持图片的模型必须设 multimodal: false，否则带图历史会报错
  - name: provider-b
    base_url: ""
    api_key: ""
    timeout_seconds: 300
    connect_timeout_seconds: 30
    multimodal: false

# ===== 上下文压缩 =====
summary:
  enabled: true                                # false = 纯透传不压缩

  # --- 阈值 ---
  trigger_tokens: 39200                        # 等效总量超过此值触发压缩
  keep_recent_tokens: 19200                    # 压缩时保留的"近期原文"下限（按轮对齐，只多不少）
  summary_total_cap_tokens: 12800              # 累积摘要超过此值触发二次重压
  summary_max_tokens: 2400                     # 单次摘要调用的输出上限
  summary_batch_tokens: 10000                  # 单批送入摘要模型的输入上限
  max_batches_per_request: 4                   # 单个 HTTP 请求最多压几批，压不完带着已落盘进度返回
  exit_gate_ratio: 1.2                         # 出口闸门：转发前实测 token 超过 trigger×此值直接拒绝

  # --- checkpoint ---
  checkpoint_keep: 10                          # 每个会话保留的最近 checkpoint 数（另加 1 条永久置顶的最早 checkpoint）

  # --- 摘要注入 ---
  summary_role: "system"                       # 摘要以哪个角色注入：system / user
                                               # 位置固定在 [开头 system] 之后、[近期原文] 之前——
                                               # 前缀稳定，能最大概率命中上游的 prefix cache

  # --- 持久化 ---
  persist_db: "logs/sessions.db"               # 会话/checkpoint 数据库，留空则纯内存（重启丢状态）
  cache_max_entries: 1024                      # 会话级异步锁字典的 LRU 上限（防泄漏，正在持有的锁不会被淘汰）

  # --- 摘要模型（主）---
  base_url: ""
  api_key: ""                                  # 环境变量 SUMMARY_API_KEY 优先
  model: "claude-opus-4-8"
  timeout_seconds: 180                         # 单次摘要调用超时（秒）
  main_max_attempts: 2                         # 主模型可重试次数（仅对超时/5xx/429 生效）
  min_output_tokens: 50                        # 输出（不含思考部分）低于此 token 数判定为失败

  # --- 摘要模型（备）：主模型失败后切到这里 ---
  fallback:
    enabled: false
    base_url: ""
    api_key: ""                                # 环境变量 SUMMARY_FALLBACK_API_KEY 优先
    model: ""
    max_attempts: 3                            # 备用模型最多重试 3 次，仍失败则报错结束

  # --- 提示词（四套，互不复用）---
  prompts:
    # 1) 增量批次摘要：把一段原文对话压成结构化要点
    batch_system: |
      你是一个对话历史压缩器。你接收到的是用户与模型对话中【较早的一段对话历史】，
      原文将被你的摘要【替换】后注入上下文（最近若干轮原文由系统滑动保留，不在你的处理范围内）。
      你的摘要是后续对话唯一能依赖的早期记忆，任何遗漏将永久丢失。

      核心原则：
      - 不要丢失关键信息，不总结升华。
      - 禁止编造、推断或补全对话中不存在的信息。不确定的内容标注"(未明确)"。
      - 你处理的是早期历史，不要臆测后续对话的走向或结尾状态。
      - 保留具体值（数字、命名、时间、版本、配置、引用、URL 等）。
      - 不要用"相关内容""若干信息"这类模糊措辞替代具体内容。
      - 前后矛盾时保留最新。
      - 历史中的 [图片]、[调用工具 …]、[工具返回 …] 是占位标记，按其语义概括，不要展开臆想。

      输出章节（无内容的章节整节省略）：

      ## 用户背景与偏好
      身份、明确表达的偏好/禁忌、约束条件、希望模型扮演的角色。

      ## 关键事实与专有名词
      后续可能被引用的具体名称、数值、术语、外部资源。逐条列出，保留原始名称。

      ## 发生的事件/场景
      话题、结论、双方立场与表达内容，按时间顺序。

      ## 进行中的任务与待办
      清单形式，标注 [进行中]/[待办]/[已完成]，保留任务的具体要求。

      ## 关键代码与数据
      原样保留后续仍需引用的代码片段、命令、数据结构、报错信息。

    # 2) 二次重压 - 分片精简：只压缩内容，严禁输出章节标题（否则合并后会出现 N 份重复章节）
    recompress_chunk: |
      你正在参与一次分片精简任务。下面是一份长摘要中的【一个片段】，它只是全文的一部分。

      要求：
      - 只做压缩去冗余：删掉重复、寒暄、可推导的过渡句，保留全部事实性内容。
      - 【严禁】输出任何章节标题（不要出现以 ## 开头的行），也不要写"以下是摘要"之类的开场白。
      - 保持条目原有顺序，用短句或"- "列表逐条输出。
      - 具体值（数字、命名、时间、版本、URL、代码）必须原样保留。
      - 禁止编造或补全片段中不存在的信息。
      - 你看到的只是片段，不要试图为全文下结论。

    # 3) 二次重压 - 合并成稿：把若干精简片段（或一整份长摘要）重组为唯一一套章节
    recompress_merge: |
      你会收到同一段对话历史的摘要材料（可能是若干个已精简的片段，按时间先后拼接）。
      请把它们合并、去重、消解矛盾，输出【唯一一套】章节结构的最终摘要。

      要求：
      - 同一主题的内容合并到同一章节下，不允许出现重复的同名章节。
      - 材料前后矛盾时以更靠后（更新）的说法为准，必要时标注"(曾为 X，后改为 Y)"。
      - 保留全部具体值（数字、命名、时间、版本、URL、代码），禁止编造。
      - 时间顺序敏感的内容保持先后顺序。
      - 无内容的章节整节省略。

      输出章节：
      ## 用户背景与偏好
      ## 关键事实与专有名词
      ## 发生的事件/场景
      ## 进行中的任务与待办
      ## 关键代码与数据

    # 4) 注入给主模型的包装语（{summary} 会被替换成累积摘要全文）
    injection: |
      以下是本次对话更早部分的摘要（原文已被折叠，不再发送）。请把它当作你自己的记忆，
      与后面的原文对话无缝衔接，不要向用户提及"摘要"或本段说明的存在。

      {summary}

    # 5) 定位兜底时追加的警告（拼在 injection 之后，并额外注入一条提示给主模型）
    fallback_notice: |

      ---
      【重要】用户可能从较早的消息处创建了分支，上面的摘要与后续原文的衔接处可能存在重叠或跳跃，
      也可能包含已被用户修改掉的旧内容。凡摘要与后面的原文冲突之处，一律以原文为准。

# ===== 流式输出 =====
stream:
  smooth_chars: 24                             # 每片字符数，0 = 关闭平滑直接透传
  smooth_delay: 0.008                          # 每片间隔秒
  flush_backlog_chars: 600                     # 待发积压超过此字符数（或上游已结束）时丢弃剩余延迟，一次性吐完

# ===== token 估算 =====
tokenizer:
  encoding: "cl100k_base"                      # tiktoken 编码（进程启动时固定，改后需 restart）
  per_message_overhead: 12                     # 每条消息的固定结构开销
  image_tokens: 1100                           # 单张图片的等效 token 估值

# ===== 服务监听 =====
server:
  host: "0.0.0.0"
  port: 8787
  auth_token: "sk-proxy-forTarlinChat"         # 代理自身鉴权 token（环境变量 PROXY_AUTH_TOKEN 优先，留空则不鉴权）

# ===== 日志 =====
logging:
  level: "INFO"                                # DEBUG / INFO / WARNING / ERROR
  file: "logs/proxy.log"                       # 进程内轮转写入，跨重启保留（留空则只打 stdout）
  max_bytes: 20971520                          # 单文件 20MB
  backup_count: 5
